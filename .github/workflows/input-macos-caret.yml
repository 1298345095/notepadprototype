name: Compare patched Cocoa composition caret with NSTextView
on:
  push:
    branches: [evaluate/fltk-native-input]
    paths: ['experiments/input-host/cocoa-caret/**', '.github/workflows/input-macos-caret.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  caret:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Set up the same macOS hosts and apply one shared Cocoa adjustment
        env: {HOMEBREW_NO_AUTO_UPDATE: '1'}
        run: |
          brew install fltk wxwidgets@3.2
          curl -fsSL --retry 3 https://www.scintilla.org/scintilla568.tgz -o scintilla568.tgz
          echo 'ca7fda23125289bbf473afd6fcd4959f65e828bff1a8ae60c603b34dfcb3a777  scintilla568.tgz' | shasum -a 256 -c -
          tar xzf scintilla568.tgz
          patch -d scintilla -p1 < experiments/input-host/cocoa-caret/marked-range.patch
      - name: Measure both hosts with Quartz and an NSTextView control
        run: |
          set -o pipefail
          NP4_PINYIN_QUARTZ=1 NP4_ROUTE_ARROWS=1 bash experiments/input-host/mac/run.sh "$PWD/scintilla" fltk "$(brew --prefix fltk)/bin/fltk-config" 2>&1 | tee fltk-caret.txt
          NP4_PINYIN_QUARTZ=1 bash experiments/input-host/mac/run.sh "$PWD/scintilla" wx "$(brew --prefix wxwidgets@3.2)/bin/wx-config-3.2" 2>&1 | tee wx-caret.txt
          python3 experiments/input-host/cocoa-caret/check.py fltk-caret.txt wx-caret.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cocoa-caret-fltk-wx, path: '*-caret.txt'}
